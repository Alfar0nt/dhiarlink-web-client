# Dhiarlink Web Client — nginx config for bare metal deployment
#
# Serves the production build (build/) on port 8081.
# Caddy reverse proxy routes app.dhiarr.qzz.io → 127.0.0.1:8081.
#
# Installation:
#   sudo cp config/bare-metal/nginx.conf /etc/nginx/sites-available/dhiarlink-dashboard
#   sudo ln -s /etc/nginx/sites-available/dhiarlink-dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl restart nginx

server {
    listen 127.0.0.1:8081;
    server_name app.dhiarr.qzz.io;
    charset utf-8;

    # Path to the production build output
    root /opt/dhiarlink-web-client/build;
    index index.html;

    # --- Gzip Compression ---------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --- Security Headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # HTML files — never cache (ensures new deploys are picked up immediately)
    location ~* \.(?:manifest|appcache|html?|xml|json)$ {
        expires -1;
    }

    # Images and binary assets — cache 1 month
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        add_header Cache-Control "public";
    }

    # JS and CSS — cache 1 year (filenames are content-hashed)
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts — cache 1 year
    location ~* \.(?:woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # servers.json — pre-configured server connection (optional)
    location = /servers.json {
        try_files /servers.json =404;
    }

    # Static files with extension — try exact match, then 404
    location ~* .+\.(css|js|html|png|jpe?g|gif|bmp|ico|json|csv|otf|eot|svg|svgz|ttf|woff|woff2|ijmap|pdf|tif|map) {
        try_files $uri $uri/ =404;
    }

    # SPA fallback — all other routes serve index.html (React Router handles routing)
    location / {
        try_files $uri $uri/ /index.html$is_args$args;
    }
}
